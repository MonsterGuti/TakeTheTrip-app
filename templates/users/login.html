{% extends 'rides/base.html' %}

{% block content %}
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<div class="row justify-content-center align-items-center min-vh-75 my-5">
    <div class="col-lg-5 col-md-7 col-sm-10">
        <div class="card shadow-lg border-0 rounded-4 p-4 p-md-5 bg-white">

            <!-- Заглавна част -->
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center bg-primary-subtle text-primary rounded-circle mb-3" style="width: 56px; height: 56px;">
                    <i class="fa-solid fa-user-lock fs-4"></i>
                </div>
                <h3 class="fw-bold text-dark mb-1">Вход в профила</h3>
                <p class="text-muted small mb-0">Въведете вашите данни, за да продължите</p>
            </div>

            <form method="POST" action="{% url 'login' %}">
                {% csrf_token %}

                <input type="hidden" name="next" value="{{ request.GET.next }}">

                <!-- Грешки при грешно потребителско име или парола -->
                {% if form.non_field_errors %}
                    <div class="alert alert-danger border-0 bg-danger-subtle text-danger py-2 px-3 small rounded-3 mb-3 d-flex align-items-center gap-2">
                        <i class="fa-solid fa-circle-exclamation"></i>
                        <div>
                            {% for error in form.non_field_errors %}
                                {{ error }}
                            {% endfor %}
                        </div>
                    </div>
                {% endif %}

                <!-- Потребителско име -->
                <div class="mb-3">
                    <label class="form-label fw-semibold text-secondary small">Потребителско име</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" name="username" class="form-control bg-light border-start-0 ps-0" placeholder="Въведете потребителско име" required autofocus>
                    </div>
                </div>

                <!-- Парола -->
                <div class="mb-4">
                    <label class="form-label fw-semibold text-secondary small mb-1">Парола</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" name="password" class="form-control bg-light border-start-0 ps-0" placeholder="••••••••" required>
                    </div>
                </div>

                <!-- Бутон за вход -->
                <button type="submit" class="btn btn-primary w-100 py-2.5 fw-semibold rounded-3 shadow-sm mb-3">
                    Вход
                </button>
            </form>

            <!-- Връзка към регистрация -->
            <div class="text-center border-top pt-3 mt-2">
                <p class="text-muted small mb-0">
                    Нямате профил?
                    <a href="{% url 'register' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}" class="fw-semibold text-primary text-decoration-none ms-1">
                        Регистрирайте се тук
                    </a>
                </p>
            </div>

        </div>
    </div>
</div>
{% endblock %}
